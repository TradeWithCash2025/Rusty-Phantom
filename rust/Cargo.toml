[workspace]
resolver = "2"
members = [
    "crates/constants",
    "crates/utils",
    "crates/base64url",
    "crates/crypto",
    "crates/sdk-types",
    "crates/api-key-stamper",
    "crates/parsers",
    "crates/chain-interfaces",
    "crates/client",
    "crates/server-sdk",
    "crates/embedded-provider-core",
    "crates/indexed-db-stamper",
    "crates/browser-injected-sdk",
    "crates/browser-sdk",
    "crates/mcp-server",
    "crates/phantom-openclaw-plugin",
    "crates/ui",
    "examples/client-demo",
    "examples/server-sdk-demo",
    "examples/multi-auth-demo",
    "examples/list-wallets",
    "examples/sign-message",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/phantom/phantom-connect-sdk"

[workspace.dependencies]
# Internal crates
phantom-constants = { path = "crates/constants" }
phantom-utils = { path = "crates/utils" }
phantom-base64url = { path = "crates/base64url" }
phantom-crypto = { path = "crates/crypto" }
phantom-sdk-types = { path = "crates/sdk-types" }
phantom-api-key-stamper = { path = "crates/api-key-stamper" }
phantom-parsers = { path = "crates/parsers" }
phantom-chain-interfaces = { path = "crates/chain-interfaces" }
phantom-client = { path = "crates/client" }
phantom-server-sdk = { path = "crates/server-sdk" }
phantom-embedded-provider-core = { path = "crates/embedded-provider-core" }
phantom-indexed-db-stamper = { path = "crates/indexed-db-stamper" }
phantom-browser-injected-sdk = { path = "crates/browser-injected-sdk" }
phantom-browser-sdk = { path = "crates/browser-sdk" }
phantom-mcp-server = { path = "crates/mcp-server" }
phantom-openclaw-plugin = { path = "crates/phantom-openclaw-plugin" }
phantom-ui = { path = "crates/ui" }

# External dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
async-trait = "0.1"
rlp = "0.6"
